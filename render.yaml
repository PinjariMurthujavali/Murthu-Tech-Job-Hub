services:
  - type: web
    name: murthu-job-hub-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:push -- --force && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://murthutech.netlify.app
      - key: ADMIN_EMAILS
        value: luckymurthu@gmail.com
      - key: DATABASE_URL
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
