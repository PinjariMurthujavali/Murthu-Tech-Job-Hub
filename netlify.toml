[build]
  command = "npm run build"
  publish = "dist"

# Netlify hosts ONLY the React frontend.
# Backend (Express + PostgreSQL) runs on Render.

[[redirects]]
  from = "/api/*"
  to = "https://murthu-job-hub-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://murthu-job-hub-api.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://murthu-job-hub-api.onrender.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://murthu-job-hub-api.onrender.com/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200